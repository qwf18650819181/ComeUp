mutation ProductVariantsCreate($productId: ID!, $variants: [ProductVariantsBulkInput!]!) {
    productVariantsBulkCreate(productId: $productId, variants: $variants) {
        productVariants {
            id
            sku
            title
            selectedOptions {
                name
                value
            }
        }
        userErrors {
            field
            message
        }
    }
}